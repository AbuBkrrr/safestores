# Host nginx for a single VPS (installed by deploy.sh):
#   safestore.com.ng      -> the landing page (website/ folder)
#   app.safestore.com.ng  -> the SAFE Stores app (frontend container, which
#                              forwards /api to the backend container)
# certbot adds the HTTPS parts to this file.

server {
    listen 80;
    server_name safestore.com.ng www.safestore.com.ng;
    root /opt/safestores/website;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name app.safestore.com.ng;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
