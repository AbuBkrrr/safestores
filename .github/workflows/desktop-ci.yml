name: Desktop backend CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (informational — Electron itself is a known outdated dependency, see project notes)
        # Electron is the app's actual runtime shell (not just a dev tool), and is
        # currently several major versions behind. Upgrading it is a deliberate,
        # separate, potentially-breaking decision — not something CI should
        # silently block on — so this step reports but never fails the build.
        run: npm audit --audit-level=low || echo "::warning::npm audit found issues — Electron itself is a known outdated dependency; see project notes before upgrading."
        continue-on-error: true

      - name: Run test suite
        run: npm test

      - name: Install Xvfb (for the Electron e2e suite — no GUI on CI runners)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Run Electron e2e suite (real window/menu lifecycle — see desktop/README.md's "Running the tests")
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7
