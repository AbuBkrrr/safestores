name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (informational — vite/esbuild dev-server-only advisory, see project notes)
        run: npm audit --audit-level=low || echo "::warning::npm audit found issues — see job output above."
        continue-on-error: true

      - name: Run test suite
        run: npm test

      - name: Confirm the production build succeeds
        run: npm run build
