# The public website (landing page). Shop, sign-in and sign-up addresses
# people type on the main domain are sent to the app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/(marketplace|marketplace-home|shop|shops)(/.*)?$ { return 302 https://app.safestore.com.ng/market; }
    location ~ ^/(login|signin|sign-in)/?$ { return 302 https://app.safestore.com.ng/login; }
    location ~ ^/(signup|register|start)/?$ { return 302 https://app.safestore.com.ng/signup$is_args$args; }
    location ~ ^/go/(.+)$ { return 302 https://app.safestore.com.ng/go/$1; }
    location = /nginx.conf { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
