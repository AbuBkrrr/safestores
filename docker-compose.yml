# Staging/local-full-stack compose file. This brings up a complete,
# self-contained copy of the cloud edition (Postgres + backend + frontend)
# — useful for a staging server, or for testing the production Docker
# images locally before deploying them anywhere real.
#
# NOT intended for production traffic as-is: the Postgres container here
# has no backup strategy, and secrets are read from a .env file next to
# this compose file rather than a real secrets manager — see
# DEPLOYMENT.md for what changes for an actual production deployment.
#
# Usage:
#   cp .env.staging.example .env
#   # edit .env — at minimum set a real JWT_SECRET
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safestores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: safestores
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safestores']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host by default — only `backend` needs to reach
    # it, over the compose network. Uncomment to inspect it directly.
    # ports:
    #   - '5432:5432'

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DATABASE_URL: postgres://safestores:${POSTGRES_PASSWORD}@postgres:5432/safestores
      DATABASE_SSL: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.staging.example for how to generate one}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BOOTSTRAP_SUPER_ADMIN_NAME: ${BOOTSTRAP_SUPER_ADMIN_NAME:-}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      SUPPORT_INBOX_EMAIL: ${SUPPORT_INBOX_EMAIL:-}
      # Caddy/host proxy -> frontend nginx -> backend: 2 proxies (see backend/src/app.js).
      TRUST_PROXY: ${TRUST_PROXY:-2}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
      # Optional TURN server for support calls on strict mobile networks (e.g. turn:turn.example.com:3478).
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      MARKETING_LANDING_URL: ${MARKETING_LANDING_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Each store's own Windows/Android apps (templates/store-app). Optional.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-AbuBkrrr/safestores}
      STORE_APP_API_URL: ${STORE_APP_API_URL:-}
      # Email + object storage — optional for staging, required for launch
      # (see LAUNCH_GUIDE.md steps 6–7). Empty values are simply ignored.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
      PAYSTACK_CURRENCIES: ${PAYSTACK_CURRENCIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
    volumes:
      # Local-disk upload storage persists across container restarts —
      # switch to S3_BUCKET (+ S3_* env vars) instead for real production,
      # per the app's own startup warning when object storage isn't set.
      - backend_uploads:/app/uploads
    # Load balancing: run several copies of the API. nginx (frontend)
    # spreads requests across them; scheduled jobs run on one elected copy;
    # live updates are shared through Postgres. Set BACKEND_REPLICAS in .env.
    # (No fixed host port, so the copies don't clash.)
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    expose:
      - '4000'
    # Migrations run once, before the app starts serving traffic — safer
    # than running them on every container start, which breaks with more
    # than one replica.
    command: sh -c "node src/db/migrate.js && node server.js"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_BIND:-8080}:80'

  # The public landing page (website/ folder), for servers where one reverse
  # proxy (e.g. Caddy) routes the main domain here and app.<domain> to frontend.
  website:
    image: nginx:1.27-alpine
    container_name: safestores-website
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  backend_uploads:
