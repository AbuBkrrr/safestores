server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so React Router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same three proxy targets as vite.config.js's dev server, so a
    # same-origin production deployment behaves identically to local dev.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Share previews, sitemap and robots come from the backend (it reads
    # the store list); everything else under / is the SPA.
    location /share/ { proxy_pass http://backend:4000; proxy_set_header Host $host; }
    location = /sitemap.xml { proxy_pass http://backend:4000; proxy_set_header Host $host; }
    location = /robots.txt { proxy_pass http://backend:4000; proxy_set_header Host $host; }

    # The service worker and the app shell must always be re-checked, or
    # users could be stuck on an old version after a deploy.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Basic hardening headers for the static app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Static assets get a long cache lifetime — Vite fingerprints filenames
    # on every build, so a stale cache is never a correctness problem.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
