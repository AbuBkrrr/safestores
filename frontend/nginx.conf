server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so React Router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same three proxy targets as vite.config.js's dev server, so a
    # same-origin production deployment behaves identically to local dev.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Static assets get a long cache lifetime — Vite fingerprints filenames
    # on every build, so a stale cache is never a correctness problem.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
