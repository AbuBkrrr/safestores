server {
    client_max_body_size 25m;
    listen 80;
    server_name _;

    # Load balancing: "backend" can be several copies (docker compose
    # deploy.replicas). Re-resolving it through Docker's DNS every 10s means
    # nginx spreads requests round-robin over every live copy, picks up new
    # ones when you scale, and drops ones that are gone.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:4000;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so React Router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same three proxy targets as vite.config.js's dev server, so a
    # same-origin production deployment behaves identically to local dev.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Share previews, sitemap and robots come from the backend (it reads
    # the store list); everything else under / is the SPA.
    location /share/ { proxy_pass $backend; proxy_set_header Host $host; }
    # Marketing short links / QR codes (they redirect to the website or sign-up).
    location /go/ { proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /sitemap.xml { proxy_pass $backend; proxy_set_header Host $host; }
    location = /robots.txt { proxy_pass $backend; proxy_set_header Host $host; }

    # The service worker and the app shell must always be re-checked, or
    # users could be stuck on an old version after a deploy.
    location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; }
    location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; }

    # Hardening headers for the whole app (see security-headers.conf).
    include /etc/nginx/security-headers.conf;
    # Hide the nginx version from attackers.
    server_tokens off;

    # Static assets get a long cache lifetime — Vite fingerprints filenames
    # on every build, so a stale cache is never a correctness problem.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
